name: "Bug report"
description: "Something is broken or behaves incorrectly"
title: "fix: "
labels: ["bugfix"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `cargo run -- /path/to/repo`
        2. Call tool `repo_status` with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant error output (will be rendered as code)
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, rustc version (e.g. Windows 11, rustc 1.79)"
    validations:
      required: false
